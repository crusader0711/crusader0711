<svg width="880" height="220" viewBox="0 0 880 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="880" height="220" fill="#0B0B0B"/>
  
  <!-- Subtle grid / industrial texture -->
  <g opacity="0.08" stroke="#39FF14" stroke-width="0.6">
    <line x1="0" y1="40" x2="880" y2="40"/>
    <line x1="0" y1="80" x2="880" y2="80"/>
    <line x1="0" y1="120" x2="880" y2="120"/>
    <line x1="0" y1="160" x2="880" y2="160"/>
    <line x1="0" y1="200" x2="880" y2="200"/>
    <line x1="110" y1="0" x2="110" y2="220"/>
    <line x1="220" y1="0" x2="220" y2="220"/>
    <line x1="330" y1="0" x2="330" y2="220"/>
    <line x1="440" y1="0" x2="440" y2="220"/>
    <line x1="550" y1="0" x2="550" y2="220"/>
    <line x1="660" y1="0" x2="660" y2="220"/>
    <line x1="770" y1="0" x2="770" y2="220"/>
